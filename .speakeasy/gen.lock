releaseNotes: "## Mcp-typescript SDK Changes:\n* `Latitudesh.Servers.lock()`:  `response.status[409]` **Added** (Breaking ⚠️)\n* `Latitudesh.Servers.reinstall()`: \n  *  `request.RequestBody.data.attributes` **Changed**\n  *  `response.status[409]` **Added** (Breaking ⚠️)\n* `Latitudesh.virtualMachines.destroy-virtual-machine-network-attachment()`:  `response.status[422]` **Added** (Breaking ⚠️)\n* `Latitudesh.Servers.updateDeployConfig()`: \n  *  `request.RequestBody.data.attributes` **Changed**\n  *  `response.data.attributes.disk_layout[].raid_level.enum(raid-10)` **Added** (Breaking ⚠️)\n* `Latitudesh.Servers.getDeployConfig()`:  `response.data.attributes.disk_layout[].raid_level.enum(raid-10)` **Added** (Breaking ⚠️)\n* `Latitudesh.Baselines (Preview).get-baselines()`:  `response.data[].attributes` **Changed** (Breaking ⚠️)\n* `Latitudesh.Baselines (Preview).create-baseline()`: \n  *  `request.data.attributes` **Changed**\n  *  `response.data.attributes` **Changed** (Breaking ⚠️)\n* `Latitudesh.Baselines (Preview).get-baseline()`:  `response.data.attributes` **Changed** (Breaking ⚠️)\n* `Latitudesh.LKS.get-lks-node-pool()`:  `response.data.attributes.server_ids` **Added**\n* `Latitudesh.virtualMachines.create()`: \n  *  `request.data.attributes.apply_network_on_boot` **Added**\n  *  `response.data.attributes.apply_network_on_boot` **Added**\n* `Latitudesh.LKS.list-lks-allocatable-servers()`: **Added**\n* `Latitudesh.LKS.list-lks-node-pools()`:  `response.data[].attributes.server_ids` **Added**\n* `Latitudesh.Servers.create()`: \n  *  `request.data.attributes` **Changed**\n* `Latitudesh.LKS.update-lks-node-pool()`: \n  *  `request.update_lks_node_pool.data.attributes.server_ids` **Added**\n  *  `response.data.attributes.server_ids` **Added**\n* `Latitudesh.LKS.create-lks-node-pool()`: \n  *  `request.create_lks_node_pool.data.attributes` **Changed**\n  *  `response.data.attributes.server_ids` **Added**\n* `Latitudesh.Filesystem Storage.attach-filesystem()`: **Added**\n* `Latitudesh.Filesystem Storage.detach-filesystem()`: **Added**\n* `Latitudesh.virtualMachines.list()`:  `response.data[].attributes.apply_network_on_boot` **Added**\n* `Latitudesh.LKS.list-lks-nodes()`: **Added**\n* `Latitudesh.virtualMachines.get()`:  `response.data.attributes.apply_network_on_boot` **Added**\n* `Latitudesh.virtualMachines.update-virtual-machine()`:  `response.data.attributes.apply_network_on_boot` **Added**\n* `Latitudesh.virtualMachines.list-virtual-machine-network-attachments()`:  `response.data[].attributes` **Changed**\n* `Latitudesh.Filesystem Storage.get-filesystem-attachment()`: **Added**\n"
