
name = "latitudesh-mcp-server"
main = "src/cloudflare-worker/cloudflare-worker.ts"
compatibility_date = "2025-07-15"

# Enable node compatibility for MCP SDK
compatibility_flags = ["nodejs_compat", "enable_request_signal"]

# Durable Object hosting legacy SSE and Streamable HTTP sessions; existing namespaces and stored state are kept
[[durable_objects.bindings]]
name = "LATITUDESH_MCP"
class_name = "LatitudeshMCP"

[[migrations]]
tag = "v1"
new_classes = ["LatitudeshMCP"]

# Static assets configuration
[assets]
directory = "./static"
binding = "ASSETS"
run_worker_first = true

# Development configuration
[dev]
port = 8787